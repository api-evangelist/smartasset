aid: smartasset
name: SmartAsset
description: >-
  SmartAsset is a financial technology company that runs the largest online
  marketplace connecting consumers with fiduciary financial advisors. Its
  SmartAdvisor matching service pairs more than 50,000 retail investors each
  month with up to three vetted advisors based on geography, investable assets,
  and preferences, while the SmartAsset Advisor Marketing Platform (AMP)
  delivers advisors a subscription stream of qualified referrals plus lead
  automation that syncs into their CRMs (Salesforce, HubSpot, Wealthbox,
  Redtail, Zoho, Pipedrive, SmartOffice). SmartAsset also publishes a large
  library of consumer personal-finance calculators and editorial content across
  taxes, retirement, mortgages, investing, and banking. Backed by a16z and Y
  Combinator, SmartAsset is a lead-generation and media business and does not
  currently expose a public developer API.
